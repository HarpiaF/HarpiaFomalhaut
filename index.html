<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Harpia Fomalhaut</title>

<!-- ————— Шрифты ————— -->
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Monsieur+La+Doulaise&display=swap" rel="stylesheet">

<style>
/* ————— БАЗА СТРАНИЦЫ ————— */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;

  background: url('https://files.catbox.moe/ukgj5l.png') center center no-repeat;
  background-size: cover;
  background-attachment: fixed;

  font-family: 'PT Serif', serif;
}

/* ————— МЕРЦАНИЕ ЗВЁЗД ————— */
@keyframes thtwinkle1 {
  0%, 100% { opacity:0.15; transform:scale(0.85); }
  50% { opacity:0.9; transform:scale(1); }
}
@keyframes thtwinkle2 {
  0%, 100% { opacity:0.1; transform:scale(0.8); }
  50% { opacity:0.85; transform:scale(1.1); }
}
@keyframes thtwinkle3 {
  0%, 100% { opacity:0.12; transform:scale(0.75); }
  50% { opacity:0.95; transform:scale(1.05); }
}
</style>
</head>

<body>

<!-- ————— ВНЕШНИЙ ПРОЗРАЧНЫЙ СЛОЙ ————— -->
<div style="
  padding:10px;
  border-radius:20px;
  background:rgba(233,145,255,0.22);
  display:flex;
  justify-content:center;
  align-items:center;
">

<!-- ————— ВНУТРЕННЯЯ ВИЗИТКА ————— -->
<div style="
  position:relative;
  max-width:420px;
  width:100%;
  padding:18px;
  display:flex;
  gap:14px;
  border-radius:16px;

  background:rgba(255,255,255,0.40);
  border:3px solid rgba(255,255,255,0.85);

  box-shadow:
    0 0 12px rgba(255,255,255,0.4),
    0 0 26px rgba(200,180,255,0.25);

  color:#d4c8ff;
">

<!-- ————— ЗВЁЗДНЫЙ ФОН ВИЗИТКИ ————— -->
<div style="
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:0;
  overflow:hidden;
">

  <div style="
    position:absolute;
    top:50%;
    left:50%;
    width:120px;
    height:120px;
    transform:translate(-50%, -50%) rotate(45deg);
    border-radius:6px;
    background:rgba(255,255,255,0.18);
    filter:blur(1px);
  "></div>

  <div style="
    position:absolute;
    top:18%;
    left:22%;
    width:6px;
    height:6px;
    border-radius:50%;
    background:rgba(255,255,255,0.7);
    animation:thtwinkle1 3s infinite ease-in-out;
  "></div>

  <div style="
    position:absolute;
    top:72%;
    left:68%;
    width:4px;
    height:4px;
    border-radius:50%;
    background:rgba(255,255,255,0.6);
    animation:thtwinkle2 2.4s infinite ease-in-out;
  "></div>

  <div style="
    position:absolute;
    top:30%;
    left:75%;
    width:5px;
    height:5px;
    border-radius:50%;
    background:rgba(255,255,255,0.65);
    animation:thtwinkle3 3.6s infinite ease-in-out;
  "></div>
</div>

<!-- ————— АВАТАРКА ————— -->
<div style="flex:0 0 auto; display:flex; align-items:center; justify-content:center; z-index:1;">

  <div style="
    width:115px;
    height:115px;
    border-radius:50%;
    background:rgba(255,255,255,0.28);
    display:flex;
    align-items:center;
    justify-content:center;
  ">

    <div style="
      width:95px;
      height:95px;
      border-radius:50%;
      background:rgba(255,255,255,0.45);
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
    ">
      <img src="https://files.catbox.moe/mq8fye.gif" style="
        width:100%;
        height:100%;
        object-fit:cover;
      ">
    </div>
  </div>
</div>

<!-- ————— ТЕКСТ ————— -->
<div style="flex:1; display:flex; flex-direction:column; gap:6px; align-items:center; z-index:1;">

  <div style="
    font-family:'Monsieur La Doulaise', cursive;
    font-size:2.2rem;
    color:#ffffff;
    text-align:center;
    text-shadow:
      0 0 8px #e6d9ff,
      0 0 14px #c9b4ff,
      0 0 28px #9c7cff;
  ">
    HarpiaFomalhaut
  </div>

  <div style="font-weight:700;color:#ffffff;text-align:center;">
    ₊•́ Guardian of the Stargate North •́₊
  </div>

  <div style="font-size:0.9rem;color:#f1e3ff;text-align:center;">
    Sevda / animal artist / 20 y.o.
  </div>

  <div style="margin-top:8px;font-size:0.85rem;color:#ffffff;line-height:1.35;text-align:center;">
    ✦ Hello and welcome! ✦<br>
    Feral artist focusing on wolves from my original setting Aerolune.<br>
    Inspired by night skies, distant stars, and birds in flight.
  </div>

  <div style="margin-top:8px;display:flex;flex-direction:column;gap:6px;">
    <a href="https://www.deviantart.com/harpiafomalhaut" style="color:#fff;text-decoration:none;">✦ DeviantArt ✦</a>
    <a href="https://www.furaffinity.net/user/harpiafomalhaut" style="color:#fff;text-decoration:none;">✦ FurAffinity ✦</a>
    <a href="https://t.me/harpiafomalhaut" style="color:#fff;text-decoration:none;">✦ Telegram ✦</a>
  </div>

</div>
</div>
</div>

</body>
</html>
